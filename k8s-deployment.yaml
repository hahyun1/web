apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: my-web-container
        image: web-my-app:latest
        imagePullPolicy: Never      # 로컬 이미지를 쓰겠다는 뜻
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  type: NodePort
  selector:
    app: my-web-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001 # 브라우저에서 접속할 포트