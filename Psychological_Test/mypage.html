<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>마이페이지</title>
        <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="mypage.css">
    
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
<body>
    <header>  
        <nav class="Top_bar">
            <a class="icon_link" href="home.html">
                <span class="logo-text">TestTalk</span>
            </a>

            <div class="menu-group">
                <ul>
                    <li><a href="#" onclick="fetchAndRenderTests('연애'); return false;">연애</a></li>
                    <li><a href="#" onclick="fetchAndRenderTests('성격'); return false;">성격</a></li>
                    <li><a href="#" onclick="fetchAndRenderTests('AI'); return false;">AI</a></li>
                    <li><a href="#fortune" onclick="location.reload()">운세</a></li> 
                </ul>
            </div>

            <div class="right-group">
                <div class="search-bar">
                    <input type="text" placeholder="테스트 검색...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <ul class="login-group">
                    <li><a href="login.html">로그인</a></li>
                    /
                    <li><a href="signup.html">회원가입</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="mypage-main">
    
        <section class="user-profile-section">
            <div class="profile-card">
                <div class="user-avatar">
                    <i class="fas fa-user-circle" style="font-size: 1.2em;"></i>
                </div>
                
                <div class="profile-info">
                    <h1 id="userNickname"></h1> 
                    <p class="greeting">오늘도 즐거운 하루 보내세요! ✨</p>
                    <div class="stats-group">
                        <span id="likeCount"><i class="fas fa-heart"></i> 좋아요 0개</span>
                        <span class="divider">|</span>
                        <span id="historyCount"><i class="fas fa-chart-bar"></i> 완료한 테스트 0개</span>
                    </div>
                </div>
    
                <div class="settings-icon-btn" onclick="switchTab('settings')">
                    <i class="fas fa-cog"></i>
                </div>
            </div>
        </section>
    
        <section class="mypage-tabs-section">
            <div class="tabs-container">
                <button class="tab-btn active" data-tab="liked">
                    <i class="far fa-heart"></i> 좋아요한 테스트
                </button>
                <button class="tab-btn" data-tab="history">
                    <i class="far fa-chart-bar"></i> 참여 내역
                </button>
                <button class="tab-btn" data-tab="settings">
                    <i class="fas fa-cog"></i> 내 정보 수정
                </button>
            </div>
        </section>
    
        <section class="mypage-content-section">
    
            <div id="liked" class="tab-content active">
                <div class="content-title-wrapper">
                    <h2 class="content-title">내가 찜한 테스트 ❤️</h2>
                </div>
                <div id="likedTestGrid" class="test-grid-container"></div>
            </div>
        
            <div id="history" class="tab-content">
                <h2 class="content-title">최근 참여 내역 📊</h2>
                <div id="historyList" class="test-grid-container"></div>
            </div>
            
            <div id="settings" class="tab-content">
                <h2 class="content-title">내 정보 수정 ⚙️</h2>
                <div id="settingsContainer" class="settings-container"></div> 
            </div>
        
        </section>
        
    </main>
    
    <script src="common.js"></script> 
    <script src="main.js"></script>
    <script src="mypage.js"></script> 
</body>
</html>
