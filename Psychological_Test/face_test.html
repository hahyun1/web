<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <header>  
        <nav class="Top_bar">
            <a class="icon_link" href="home.html">
                <span class="logo-text">TestTalk</span>
            </a>
            <div class="menu-group">
                <ul>
                    <li><a href="#" onclick="fetchAndRenderTests('연애'); return false;">연애</a></li>
                    <li><a href="#" onclick="fetchAndRenderTests('성격'); return false;">성격</a></li>
                    <li><a href="#" onclick="fetchAndRenderTests('AI'); return false;">AI</a></li>
                    <li><a href="#fortune" onclick="location.reload()">운세</a></li> 
                </ul>
            </div>
            <div class="right-group">
                <div class="search-bar">
                    <input type="text" placeholder="테스트 검색...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <ul class="login-group">
                    <li><a href="login.html">로그인</a></li>
                    /
                    <li><a href="signup.html">회원가입</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="test-container" style="text-align: center; margin-top: 120px; padding-bottom: 50px;">
        <h1 style="font-family: 'Jua', sans-serif; color: #4A3B32; margin-bottom: 10px;">인공지능 동물상 테스트 🤖</h1>
        <p style="color: #8D8276; margin-bottom: 40px;">얼굴 사진을 올리면 인공지능이 분석해줍니다!</p>

        <div class="image-upload-wrap" style="margin-bottom: 30px;">
            <label for="file-input" style="cursor: pointer; background-color: #8F9F85; color: white; padding: 12px 25px; border-radius: 8px; font-weight: bold; transition: 0.3s;">
                <i class="fas fa-camera"></i> 사진 업로드
            </label>
            <input id="file-input" type='file' onchange="readURL(this);" accept="image/*" style="display: none;" />
        </div>

        <div style="position: relative; display: inline-block;">
            <img id="face-image" src="#" alt="your image" style="max-width: 300px; display: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);"/>
            
            <p id="loading-msg" style="display:none; font-weight:bold; color:#8F9F85; margin-top: 15px;">
                <i class="fas fa-spinner fa-spin"></i> AI가 분석 중입니다...
            </p>
        </div>

        <div id="label-container" style="margin-top: 30px; font-size: 1.3rem; font-weight: bold; color: #4A3B32;"></div>
        
        <button onclick="window.location.reload()" style="margin-top:30px; padding:10px 25px; cursor:pointer; background: white; border: 1px solid #ccc; border-radius: 8px; color: #555;">
            <i class="fas fa-redo"></i> 다시 하기
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script src="face_test.js"></script>
</body>
</html>
