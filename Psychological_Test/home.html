<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심리테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="home.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <header>  
        <nav class="Top_bar">
            <a class="icon_link" href="../index.html">
                <span class="logo-text">JHH Portfolio</span>
            </a>

            <div class="menu-group">
                <ul>
                    <li><a href="#">연애</a></li>
                    <li><a href="#">사회생활</a></li>
                    <li><a href="#">성격</a></li>
                    <li><a href="#fortune">운세</a></li>
                </ul>
            </div>

            <div class="right-group">
                <div class="search-bar">
                    <input type="text" placeholder="테스트 검색...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <ul class="login-group">
                    <li><a href="#">로그인</a></li>
                    /
                    <li><a href="#">회원가입</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="highlight-tests-carousel">
        <h2 class="section-title" style="margin-bottom: 80px;">추천 콘텐츠</h2>
        <div class="carousel-window"> 
            <div class="highlight-track"></div>
        </div>
    </section>

    <section class="today-fortune" id="fortune">
        <div class="fortune-container">
            <h2>오늘의 운세</h2>
            <p>포춘 쿠키를 깨보세요 🥠</p>
            <div class="fortune-cookie-icon">
                <div class="cookie-face"><span style="font-size: 80px;">🥠</span></div>
            </div>
            <button class="fortune-btn">운세 확인하기</button>
        </div>
    </section>

    <section class="all-tests">
        <h2 class="section-title">전체 심리테스트</h2>
        <div class="test-grid-container"></div>
    </section>
    
    <div id="react-footer"></div>

    <script src="main.js"></script>

    <script type="text/babel">
        function Footer() {
            return (
                <footer className="footer">
                    <h3 style={{ fontSize: '1rem', color: '#555' }}>React로 만든 푸터입니다 ⚛️</h3>
                    <p style={{ fontSize: '0.9rem', color: '#777' }}>e-mail: 2301491@kunsan.ac.kr</p>
                </footer>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-footer'));
        root.render(<Footer />);
    </script>
</body>
</html>
